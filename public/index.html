<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HunkLens — AI 代码审阅</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">🔍 HunkLens</div>
  <select id="repoSel" title="仓库"></select>
  <select id="baseSel" title="基准分支"></select>
  <span class="arrow">←</span>
  <select id="compareSel" title="对比分支"></select>
  <button id="startBtn" class="primary">🚀 开始 Review</button>
  <button id="exportBtn" title="导出 Markdown 结论">导出</button>
  <span id="rulesBadge" class="badge" title=""></span>
  <span id="progress" class="progress"></span>
</header>
<div id="chips"></div>
<main>
  <section id="diffArea">
    <div id="placeholder" class="placeholder">选择仓库和分支，点「🚀 开始 Review」——我会自动拉 diff、逐块 AI 分析，往下滚动即可查看，每处改动的分析直接显示在旁边。</div>
  </section>
  <aside id="aiPanel">
    <div class="panel-section">
      <h3>📄 需求文档 <span id="reqMark"></span></h3>
      <textarea id="reqText" placeholder="粘贴需求 / 设计方案 / PRD 摘要…&#10;AI 将对照需求评估每处改动"></textarea>
      <input id="reqFiles" placeholder="仓库内文档路径，逗号分隔：docs/prd.md">
      <button id="reqSave" class="small">保存需求</button>
    </div>
    <div class="panel-section chat">
      <h3>💬 问 AI</h3>
      <div id="chatMsgs"></div>
      <div class="chat-input">
        <input id="chatInput" placeholder="针对本次变更提问…">
        <button id="chatSend" class="small primary">发送</button>
      </div>
    </div>
  </aside>
</main>
<div id="reqFilesErr" style="display:none"></div>
<script src="app.js"></script>
</body>
</html>
